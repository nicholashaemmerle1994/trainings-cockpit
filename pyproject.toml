[project]
name = "trainings-cockpit"
version = "0.1.0"
description = "Lokales Trainings- und Recovery-Cockpit für Garmin + Amazfit/Zepp über intervals.icu"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "garmin-connect-personal-api-python>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
tc = "trainings_cockpit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainings_cockpit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".uv-cache", ".uv-python", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
